<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#183e31">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <title>Meu Fluxo | Finanças pessoais</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-v2.css">
</head>
<body>
  <div class="app" id="app">
    <header class="hero" id="hero"></header>
    <main id="view" class="view"></main>
    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-tab="home" class="nav-item active"><span>⌂</span>Início</button>
      <button data-tab="entries" class="nav-item"><span>≋</span>Lançamentos</button>
      <button data-tab="investments" class="nav-item"><span>◈</span>Investir</button>
      <button data-tab="settings" class="nav-item"><span>⚙</span>Ajustes</button>
    </nav>
    <button class="fab" id="quickAdd" aria-label="Adicionar lançamento">+</button>
  </div>
  <div class="sheet-backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div><div class="sheet-head"><h2 id="sheetTitle">Adicionar</h2><button class="icon-close" id="closeSheet" aria-label="Fechar">×</button></div><form id="sheetForm" novalidate></form>
  </section>
  <div id="toast" class="toast" role="status"></div>
  <template>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">VISÃO DO MÊS</p><h1>Meu Fluxo</h1></div>
      <div class="header-actions">
        <span id="syncState" class="sync-state">Somente neste dispositivo</span>
        <button class="icon-button" id="openSettings" aria-label="Configurar sincronização">⚙</button>
        <div class="month-nav"><button id="previousMonth" aria-label="Mês anterior">‹</button><strong id="currentMonth"></strong><button id="nextMonth" aria-label="Próximo mês">›</button></div>
      </div>
    </header>

    <section class="hero-grid">
      <article class="hero-card balance-card"><span class="card-label">Livre para gastar</span><strong id="freeToSpend">R$ 0,00</strong><p id="freeToSpendNote">Defina seu orçamento abaixo</p><div class="progress"><span id="budgetProgress"></span></div></article>
      <article class="hero-card save-card"><span class="card-label">Meta de reserva</span><strong id="savingGoalValue">R$ 0,00</strong><p id="savingStatus">Ainda não configurada</p></article>
      <article class="hero-card investment-card"><span class="card-label">Patrimônio investido</span><strong id="totalInvested">R$ 0,00</strong><p id="investmentReturn">Rendimento mensal estimado: R$ 0,00</p></article>
    </section>

    <section class="daily-section">
      <div class="section-intro"><p class="eyebrow">REGISTROS RÁPIDOS</p><h2>Movimentações do dia</h2></div>
      <div class="content-grid daily-grid">
        <article class="panel compact-panel"><div class="panel-heading"><div><p class="eyebrow">SAÍDAS</p><h2>Gastos do mês</h2></div><button class="button primary" id="addExpense">+ Gasto</button></div><div class="list" id="expenseList"></div><p class="empty" id="expenseEmpty">Nenhum gasto lançado neste mês.</p></article>
        <article class="panel compact-panel"><div class="panel-heading"><div><p class="eyebrow">ENTRADAS</p><h2>Receitas recebidas</h2></div><button class="button income-button" id="addIncome">+ Entrada</button></div><div class="list" id="incomeList"></div><p class="empty" id="incomeEmpty">Nenhuma entrada adicional lançada neste mês.</p></article>
      </div>
    </section>

    <section class="settings-section">
      <div class="section-intro"><p class="eyebrow">PLANEJAMENTO</p><h2>Organização mensal</h2></div>
      <section class="panel budget-panel"><div class="panel-heading"><div><p class="eyebrow">ORÇAMENTO</p><h2>Receitas e meta</h2></div><button class="button primary" id="saveBudget">Salvar</button></div><div class="form-grid"><label>Salário líquido<input id="salary" class="currency" inputmode="decimal" placeholder="R$ 0,00"></label><label>Reserva desejada<input id="savingGoal" class="currency" inputmode="decimal" placeholder="R$ 0,00"></label><label>Outras receitas recorrentes<input id="otherIncome" class="currency" inputmode="decimal" placeholder="R$ 0,00"></label></div><div class="budget-summary"><span>Receitas <b id="incomeTotal">R$ 0,00</b></span><span>Contas fixas <b id="fixedTotal">R$ 0,00</b></span><span>Gastos variáveis <b id="variableTotal">R$ 0,00</b></span></div></section>
      <article class="panel compact-panel"><div class="panel-heading"><div><p class="eyebrow">COMPROMISSOS</p><h2>Contas fixas</h2></div><button class="button secondary" id="addFixed">+ Adicionar</button></div><div class="list" id="fixedList"></div><p class="empty" id="fixedEmpty">Nenhuma conta fixa cadastrada ainda.</p></article>
    </section>

    <section class="panel investments-panel"><div class="panel-heading"><div><p class="eyebrow">INVESTIMENTOS</p><h2>Carteira e rendimentos</h2></div><button class="button secondary" id="addInvestment">+ Adicionar investimento</button></div><div class="rate-row"><label>Taxa CDI anual<input id="cdiRate" inputmode="decimal" placeholder="Ex.: 14,90"></label><button class="link-button" id="updateCdi">Salvar taxa CDI</button><span id="rateMessage">Use a taxa que preferir.</span></div><div class="investment-table-wrap"><table><thead><tr><th>Investimento</th><th>Valor aplicado</th><th>% do CDI</th><th>Rendimento mensal estimado</th><th></th></tr></thead><tbody id="investmentList"></tbody></table></div><p class="empty" id="investmentEmpty">Adicione seus investimentos para acompanhar os rendimentos.</p></section>
  </main>
  <dialog id="entryModal"><form id="entryForm" novalidate><div class="modal-heading"><h2 id="modalTitle">Adicionar</h2><button class="close" type="button" id="closeModal" aria-label="Fechar">×</button></div><div id="modalFields" class="modal-fields"></div><div class="modal-actions"><button class="button secondary" type="button" id="cancelEntry">Cancelar</button><button class="button primary" type="submit">Salvar</button></div></form></dialog>
  <dialog id="settingsModal"><form id="settingsForm"><div class="modal-heading"><h2>Sincronizar dados</h2><button class="close" type="button" id="closeSettings">×</button></div><p class="modal-copy">Cole a URL do aplicativo da web do Google Apps Script e a chave criada na planilha. Assim, seus dados ficam iguais em todos os seus dispositivos.</p><div class="modal-fields"><label>URL do Apps Script<input id="scriptUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Chave de sincronização<input id="syncToken" type="password" placeholder="Sua chave secreta"></label></div><div class="modal-actions"><button class="button secondary" type="button" id="disconnect">Desconectar</button><button class="button primary" type="submit">Conectar e sincronizar</button></div></form></dialog>
  <div class="toast" id="toast"></div></template><script src="app-v2.js"></script>
</body></html>
